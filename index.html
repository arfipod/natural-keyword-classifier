<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>
        Requirements Clustering Tool
    </title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <h1>
        Requirements Clustering Tool
    </h1>

    <h2>
        Requirements
    </h2>

    <p>
        Format:
    </p>

    <pre>Requirement description</pre>

    <textarea id="input"> </textarea>

    <h2>
        Seed Categories
    </h2>

    <p>
        Format:
    </p>

    <pre>
CATEGORY: word1,word2,word3
    </pre>

    <textarea id="seedsInput"></textarea>

    <div class="controls">

        <div class="control-block">

            <label>
                Clustering Mode
            </label>

            <select id="mode">

                <option value="SUPERVISED">
                    Supervised (Seeds)
                </option>

                <option value="UNSUPERVISED">
                    Unsupervised
                </option>

            </select>

        </div>

        <div class="control-block">

            <label>
                Similarity Threshold
            </label>

            <input
                type="range"
                id="threshold"
                min="0.10"
                max="1.00"
                step="0.05"
                value="0.30"
            >

            <span id="thresholdValue">
                0.30
            </span>

        </div>

    </div>

    <button onclick="processRequirements()">

        Cluster Requirements

    </button>

    <div id="output"></div>

    <script src="vendor/compromise.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
